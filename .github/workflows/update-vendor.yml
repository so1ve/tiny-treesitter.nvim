name: Update vendor

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      nvim_treesitter_ref:
        required: false
        default: main
      arborist_ref:
        required: false
        default: main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Update vendor data
        run: node scripts/update-vendor.mjs --nvim-ref "${{ inputs.nvim_treesitter_ref || 'main' }}" --arborist-ref "${{ inputs.arborist_ref || 'main' }}"

      - name: Commit vendor data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lua/tiny-treesitter/parsers.lua plugin/filetypes.lua runtime/queries vendor-sources.json LICENSES
          git diff --cached --quiet || git commit -m "feat: update treesitter vendor data"

      - name: Push to main
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ github.token }}
          branch: main
