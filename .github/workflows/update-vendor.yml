name: Update vendor

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      nvim_treesitter_ref:
        required: false
        default: main
      arborist_ref:
        required: false
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Update vendor data
        run: node scripts/update-vendor.mjs --nvim-ref "${{ inputs.nvim_treesitter_ref || 'main' }}" --arborist-ref "${{ inputs.arborist_ref || 'main' }}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: feat/update-vendor
          commit-message: "feat: update treesitter vendor data"
          title: "feat: update treesitter vendor data"
          body-path: .vendor/update-summary.md
          add-paths: |
            lua/tiny-treesitter/parsers.lua
            plugin/filetypes.lua
            runtime/queries
            vendor-sources.json
            LICENSES/nvim-treesitter.txt
            LICENSES/arborist.nvim.txt
